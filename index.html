<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Clone - Practice Coding Problems</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html"><i class="fas fa-code"></i> LeetCode Clone</a>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">Problems</a>
            <a href="contest.html">Contest</a>
            <a href="agents.html">AI Agents</a>
            <a href="discuss.html">Discuss</a>
            <a href="premium.html">Premium</a>
        </div>
        <div class="nav-actions">
            <button class="btn-icon" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
            <div class="user-menu">
                <div class="user-avatar" id="userAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-dropdown" id="userDropdown">
                    <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
                    <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="problems-header">
            <h1>Problems</h1>
            <div class="filters">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search problems...">
                </div>
                <select id="difficultyFilter">
                    <option value="all">All Difficulties</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
                <select id="statusFilter">
                    <option value="all">All Status</option>
                    <option value="solved">Solved</option>
                    <option value="attempted">Attempted</option>
                    <option value="todo">To Do</option>
                </select>
            </div>
        </div>

        <div class="stats-cards">
            <div class="stat-card easy">
                <div class="stat-number" id="easyCount">0</div>
                <div class="stat-label">Easy</div>
            </div>
            <div class="stat-card medium">
                <div class="stat-number" id="mediumCount">0</div>
                <div class="stat-label">Medium</div>
            </div>
            <div class="stat-card hard">
                <div class="stat-number" id="hardCount">0</div>
                <div class="stat-label">Hard</div>
            </div>
        </div>

        <div class="problems-table-container">
            <table class="problems-table">
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Title</th>
                        <th>Acceptance</th>
                        <th>Difficulty</th>
                    </tr>
                </thead>
                <tbody id="problemsList">
                </tbody>
            </table>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 LeetCode Clone. Practice makes perfect.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
