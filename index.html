<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problems - LeetCode</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <a href="index.html"><i class="fas fa-code logo"></i> LeetCode</a>
    </div>
    <div class="nav-links">
      <a href="index.html" class="active">Problems</a>
      <a href="contest.html">Contest</a>
      <a href="discuss.html">Discuss</a>
      <a href="agents.html">AI Agents</a>
    </div>
    <div class="nav-actions">
      <button class="btn-icon" id="themeToggle" title="Toggle theme"><i class="fas fa-moon"></i></button>
      <div class="user-menu">
        <div class="user-avatar" id="userAvatar"><i class="fas fa-user"></i></div>
        <div class="user-dropdown" id="userDropdown">
          <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
          <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="problems-header">
      <h1>Problems</h1>
      <div class="filters">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search problems...">
        </div>
        <select id="difficultyFilter">
          <option value="all">Difficulty</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
        <select id="topicFilter">
          <option value="all">Topics</option>
        </select>
        <select id="sortSelect">
          <option value="id_asc">Problem ID</option>
          <option value="title_asc">Title A-Z</option>
          <option value="difficulty_asc">Difficulty Low-High</option>
          <option value="difficulty_desc">Difficulty High-Low</option>
          <option value="acceptance_desc">Acceptance</option>
        </select>
      </div>
    </div>

    <div id="dailyChallenge" class="daily-challenge-banner" style="display:none">
      <div>
        <i class="fas fa-calendar-day"></i>
        <strong>Daily Challenge:</strong>
        <a href="#" id="dailyChallengeLink" id="dailyChallengeTitle">Loading...</a>
      </div>
    </div>

    <div class="stats-row">
      <div class="stats-card easy">
        <div class="ring">
          <svg width="50" height="50"><circle cx="25" cy="25" r="20" fill="none" stroke="#333" stroke-width="4"/><circle cx="25" cy="25" r="20" fill="none" stroke="#00b8a3" stroke-width="4" stroke-dasharray="126" stroke-dashoffset="126" stroke-linecap="round"/></svg>
          <div class="ring-text" style="color:#00b8a3" id="easyPct">0%</div>
        </div>
        <div class="info">
          <h3>Easy</h3>
          <div class="count" id="easyCount">0</div>
          <div style="font-size:12px;color:var(--text-secondary)" id="easySolved">0 Solved</div>
        </div>
      </div>
      <div class="stats-card medium">
        <div class="ring">
          <svg width="50" height="50"><circle cx="25" cy="25" r="20" fill="none" stroke="#333" stroke-width="4"/><circle cx="25" cy="25" r="20" fill="none" stroke="#ffc01e" stroke-width="4" stroke-dasharray="126" stroke-dashoffset="126" stroke-linecap="round"/></svg>
          <div class="ring-text" style="color:#ffc01e" id="mediumPct">0%</div>
        </div>
        <div class="info">
          <h3>Medium</h3>
          <div class="count" id="mediumCount">0</div>
          <div style="font-size:12px;color:var(--text-secondary)" id="mediumSolved">0 Solved</div>
        </div>
      </div>
      <div class="stats-card hard">
        <div class="ring">
          <svg width="50" height="50"><circle cx="25" cy="25" r="20" fill="none" stroke="#333" stroke-width="4"/><circle cx="25" cy="25" r="20" fill="none" stroke="#ff375f" stroke-width="4" stroke-dasharray="126" stroke-dashoffset="126" stroke-linecap="round"/></svg>
          <div class="ring-text" style="color:#ff375f" id="hardPct">0%</div>
        </div>
        <div class="info">
          <h3>Hard</h3>
          <div class="count" id="hardCount">0</div>
          <div style="font-size:12px;color:var(--text-secondary)" id="hardSolved">0 Solved</div>
        </div>
      </div>
    </div>

    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <p>Loading problems...</p>
    </div>

    <div class="empty-state" id="emptyState" style="display:none">
      <i class="fas fa-inbox"></i>
      <h3>No problems found</h3>
      <p>Try adjusting your filters</p>
    </div>

    <div class="problems-table-container" id="problemsContainer">
      <table class="problems-table">
        <thead>
          <tr>
            <th style="width:40px"></th>
            <th style="width:60px">ID</th>
            <th>Title</th>
            <th>Tags</th>
            <th style="width:80px">Accept.</th>
            <th style="width:90px">Difficulty</th>
          </tr>
        </thead>
        <tbody id="problemsList"></tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>

  <script src="js/services.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
